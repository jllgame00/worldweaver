name: WORLDWEAVER CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/product-polish]

permissions:
  contents: read

env:
  WORLDWEAVER_PROVIDER: mock

jobs:
  test:
    name: Tests and contracts
    # The startup regression suite exercises Windows PowerShell entry points.
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install --requirement backend/requirements.txt
      - run: npm ci --prefix frontend --no-audit --no-fund
      - name: Isolate provider traffic on the hosted test machine
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-NetFirewallProfile -Profile Domain,Private,Public -Enabled True
          foreach ($executable in 'python.exe', 'node.exe') {
            $program = (Get-Command $executable -CommandType Application | Select-Object -First 1).Source
            New-NetFirewallRule -DisplayName "WORLDWEAVER offline tests $executable" -Program $program -Profile Any -Direction Outbound -Protocol TCP -RemotePort 80,443 -Action Block | Out-Null
          }
      - name: Canonical and provider transport schemas
        shell: python
        run: |
          from jsonschema import Draft4Validator, Draft202012Validator
          from backend.app.contracts import SCHEMA
          from backend.app.openai_provider import WIRE_SCHEMA
          from backend.app.scenario_wire import scenario_format
          from backend.app.semantic_review import FORMAT

          Draft4Validator.check_schema(SCHEMA)
          for wire in (WIRE_SCHEMA, FORMAT["schema"], *(scenario_format(task)[1]["schema"] for task in ("scenario", "revision"))):
              Draft202012Validator.check_schema(wire)
          print("Canonical and four transport schemas passed")
        env:
          # Actions runs Python step files from RUNNER_TEMP.
          PYTHONPATH: ${{ github.workspace }}
      - name: Backend regression
        run: python -m pytest -q
      - name: Frontend regression
        run: npm --prefix frontend test
      - name: Generated types and strict TypeScript
        run: npm --prefix frontend run typecheck

  build:
    name: Production frontend build
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend --no-audit --no-fund
      - run: npm --prefix frontend run build

  required:
    name: WORLDWEAVER required
    if: ${{ always() }}
    needs: [test, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require successful tests and build
        shell: python3 {0}
        env:
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          import os

          test, build = os.environ["TEST_RESULT"], os.environ["BUILD_RESULT"]
          print(f"Tests: {test}. Build: {build}.")
          raise SystemExit(0 if test == build == "success" else 1)
